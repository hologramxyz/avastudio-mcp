name: Validate listing package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run package
      - name: Validate Claude manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .
